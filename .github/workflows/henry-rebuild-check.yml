name: Henry-base rebuild check

on:
  push:
    branches:
      - henry-base-rebuild
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build immersive portfolio
        run: npm run build

      - name: Verify output
        run: |
          test -f public/index.html
          test -f public/models/Computer/computer_setup.glb
          test -f public/os/index.html
          test -f public/projects/aurora-vx/index.html
          echo "Build output verified"
